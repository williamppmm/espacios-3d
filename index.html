<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#253b35">
<title>Espacios 3D · Tu espacio, pieza a pieza</title>
<script>if(new URLSearchParams(location.search).get("vista")==="detallada")location.replace("terraza.html"+location.hash);</script>
<style>
/* Vista rápida: cada mueble a pantalla completa, con sus módulos. Carga las páginas de cada mueble en modo ?rapida. */
:root{--ink:#253b35;--muted:#5d6d63;--line:#d3d8ce;--paper:#f6f5ef;--card:#fffefa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.4 Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none;margin-right:auto}
.brand .mark{font:23px Georgia,serif;border:1px solid var(--ink);padding:2px 5px;line-height:1}
.brand b{font-weight:400;color:var(--muted)}
.brand span{font-size:19px}
.switch{display:flex;gap:6px;flex-wrap:wrap}
.switch button{min-height:42px;padding:8px 16px;font:14px Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:22px;cursor:pointer;touch-action:manipulation}
.switch button[aria-pressed=true]{color:#fff;background:var(--ink);border-color:var(--ink)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;min-height:42px;padding:8px 13px;font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;background:#fff}
.links a.main{color:#fff;background:var(--ink);border-color:var(--ink)}
.frame{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#e3e3dd}
@media (max-width:720px){.top{gap:8px;padding-block:8px}.brand{margin-right:0}.brand span:not(.mark){display:none}.switch button{min-height:38px;padding:6px 12px}.links{width:100%}.links a{padding:5px 10px;font-size:12px;min-height:34px}#page{display:none}}
</style>
</head>
<body>
<header class="top">
<a class="brand" href="./"><span class="mark">E³</span><span>Espacios <b>3D</b></span></a>
<nav class="switch" aria-label="Mueble">
<button type="button" data-m="cocina" aria-pressed="true">Cocina</button>
<button type="button" data-m="closet" aria-pressed="false">Clóset</button>
<button type="button" data-m="bano" aria-pressed="false">Baño</button>
</nav>
<nav class="links" aria-label="Más vistas">
<a id="page" href="cocina.html">Página del mueble ↗</a>
<a id="despiece" href="despiece-cocina.html">Despiece ↗</a>
<a class="main" href="terraza.html">Terraza completa ↗</a>
</nav>
</header>
<div class="frame"><iframe id="viewer" title="Visor 3D del mueble" src="about:blank" allow="fullscreen"></iframe></div>
<script>
(()=>{'use strict';
const M={cocina:'Cocina',closet:'Clóset',bano:'Baño'},frame=document.getElementById('viewer');
const keep=k=>{try{localStorage.setItem('espacios-rapida',k);}catch(e){}};
const read=()=>{try{return localStorage.getItem('espacios-rapida');}catch(e){return null;}};
function show(k,push){if(!M[k])k='cocina';
 for(const b of document.querySelectorAll('.switch button'))b.setAttribute('aria-pressed',String(b.dataset.m===k));
 frame.src=k+'.html?rapida';frame.title='Visor 3D · '+M[k];
 document.getElementById('page').href=k+'.html';document.getElementById('despiece').href='despiece-'+k+'.html';
 document.title=M[k]+' · Espacios 3D';keep(k);if(push)history.replaceState(null,'','#'+k);}
for(const b of document.querySelectorAll('.switch button'))b.onclick=()=>show(b.dataset.m,true);
show(location.hash.slice(1)||read()||'cocina',false);
})();
</script>
</body>
</html>
